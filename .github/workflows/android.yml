name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and assemble development APK
        run: bash ./gradlew --no-daemon :core:test :app:lintDebug :bluetooth:lintDebug :app:assembleDebug
      - name: Test static archive inspector with synthetic fixtures
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Upload OpenSense development APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenSense-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
