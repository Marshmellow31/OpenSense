name: Attach APK to release

# Builds the debug APK on GitHub's runners and attaches it to a release, so the
# upload does not depend on the maintainer's network. Runs when a release is
# published, or manually for an existing tag (Actions -> Attach APK -> Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to (for example v0.3.0-dev)
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Attach APK and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "app/build/outputs/apk/debug/XUV 500-debug.apk" XUV-500-debug.apk
          sha256sum XUV-500-debug.apk | tee XUV-500-debug.apk.sha256
          gh release upload "$TAG" XUV-500-debug.apk XUV-500-debug.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
